# Isolated automated-test stack. Safe to run anywhere: the database lives in tmpfs and is
# thrown away, the source is mounted read-only, and storage/ and bootstrap/cache/ are tmpfs,
# so nothing is written to your checkout or to the dev/prod volumes.
#
#   docker compose -f compose.test.yaml run --rm test                 # full suite
#   docker compose -f compose.test.yaml run --rm test --filter=Booking  # subset
#   docker compose -f compose.test.yaml down                          # stop the test DB
#
# Add --build after `run` when composer.lock changes.
name: devin-booking-test

services:
  test:
    build:
      context: .
      dockerfile: deploy/test.Dockerfile
    image: devin-booking-test:latest
    entrypoint: ["sh", "/var/www/html/deploy/test-entrypoint.sh"]
    environment:
      APP_ENV: testing
      # Test-only key, not used anywhere else.
      APP_KEY: "base64:1zWLkZdDCnyyZZm8JkxmR8W7noaNMQ+1s+KD57cSPKA="
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: testing
      DB_PASSWORD: testing
    # The source is mounted read-only, path by path, so tests can never modify the checkout
    # and vendor/ (with dev dependencies) comes from the image. If you add a new top-level
    # source directory, mount it here too.
    volumes:
      - ./app:/var/www/html/app:ro
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php:ro
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./lang:/var/www/html/lang:ro
      - ./public:/var/www/html/public:ro
      - ./resources:/var/www/html/resources:ro
      - ./routes:/var/www/html/routes:ro
      - ./tests:/var/www/html/tests:ro
      - ./deploy:/var/www/html/deploy:ro
      - ./artisan:/var/www/html/artisan:ro
      - ./composer.json:/var/www/html/composer.json:ro
      - ./composer.lock:/var/www/html/composer.lock:ro
      - ./phpunit.xml:/var/www/html/phpunit.xml:ro
    tmpfs:
      - /var/www/html/storage
      - /var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    # Same MySQL version as production (compose.yaml).
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: testing
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_ROOT_PASSWORD: testing
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptesting"]
      interval: 2s
      timeout: 5s
      retries: 30
